<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investment Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceff3;--card:#fff;--tx:#14202b;--mu:#5d6b7a;--bd:#d9dfe6;--in:#d9822b;--au:#1f5fa8;--up:#13795b;--dn:#c0392b;--k1:#3b4cca;--k2:#c9961a;--k3:#2a9d8f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18212b;--tx:#e8edf2;--mu:#93a1b0;--bd:#2a3644;--in:#f0a050;--au:#6aa5e8;--up:#3ec79b;--dn:#ef7a6c;--k1:#7f8cf0;--k2:#e3b84a;--k3:#4cc4b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18212b;--tx:#e8edf2;--mu:#93a1b0;--bd:#2a3644;--in:#f0a050;--au:#6aa5e8;--up:#3ec79b;--dn:#ef7a6c;--k1:#7f8cf0;--k2:#e3b84a;--k3:#4cc4b5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
.seg button:focus-visible,.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--k1);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--mu);margin-bottom:14px}
.bar input{width:78px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.big{font-size:30px}}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:10px}
.stats div span{display:block;font-size:12px;color:var(--mu)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mu);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;color:#fff}
.tag.IN{background:var(--in);color:#1a1100}.tag.AU{background:var(--au);color:#fff}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;min-width:0}
td input{width:96px;text-align:right}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input{width:110px}.form input.nm{width:150px}
.btn{font:inherit;font-weight:600;border:0;border-radius:7px;padding:8px 14px;background:var(--tx);color:var(--bg);cursor:pointer}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px;line-height:1}
.leg{display:flex;flex-direction:column;gap:8px;justify-content:center}
.leg div{display:flex;justify-content:space-between;gap:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mu)}
h2{font-size:15px;margin:0 0 10px}
.empty{padding:18px 0;text-align:center;color:var(--mu)}
.sugw{position:relative}.sug{position:absolute;left:0;top:100%;z-index:5;min-width:310px;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}.sug:empty{display:none}.opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:9px 12px;font:inherit;color:var(--tx);cursor:pointer}.opt:last-child{border:0}button.opt:hover{background:var(--bg)}

html{-webkit-text-size-adjust:100%}
.x{padding:6px 10px;border-radius:6px}
@media(max-width:640px){
.wrap{padding:12px 12px 160px}
h1{font-size:18px}
header{gap:10px}
.seg{width:100%}.seg button{flex:1;padding:11px 0;font-size:15px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:12px}
.bar input,.bar select{width:100%}
.bar .btn{grid-column:1/-1;width:100%}
.bar>span{grid-column:1/-1;font-size:12px}
.bar label:nth-of-type(2){order:1}.bar .btn{order:2}.bar>span{order:3}
.tabs{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:20;margin:0;background:var(--card);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;justify-content:space-around;overflow:visible}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:19}
.tabs button{flex:1;padding:14px 4px;border-bottom:0;border-top:3px solid transparent;font-size:14px}
.tabs button.on{border-top-color:var(--tx)}
input,select{font-size:16px;min-height:44px}
.btn{min-height:44px;font-size:15px}
.card{padding:14px}
.big{font-size:30px}
.stats{gap:16px 22px}
.donut{justify-content:center}.leg{width:100%}
.form{flex-direction:column;align-items:stretch}
.form input,.form select,.form .btn,.form input.nm,.form input.nt{width:100%}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.sugw{width:100%}.sugw input{width:100%!important}.sug{min-width:0;width:100%}
.scroll{overflow:visible}
table.tb thead{display:none}
table.tb,table.tb tbody{display:block}
table.tb tr{display:block;position:relative;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
table.tb tr:last-child td{border-bottom:0}
table.tb td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 0;text-align:right;white-space:normal}
table.tb td::before{content:attr(data-label);color:var(--mu);font-size:13px;text-align:left}
table.tb td:first-child{display:block;text-align:left;font-weight:600;font-size:16px;padding-right:44px}
table.tb td:first-child::before{content:none}
table.tb td.del{position:absolute;top:4px;right:4px;padding:0;display:block}
table.tb td.del::before{content:none}
.x{min-width:44px;min-height:44px;font-size:22px}
td input{width:140px}
}
.form input.nt{width:240px}
.nb{display:block;background:none;border:0;padding:3px 0;margin:0;font:inherit;font-size:12px;font-weight:400;color:var(--mu);text-align:left;cursor:pointer;white-space:normal;max-width:260px}
.nb:hover{color:var(--tx)}
@media(max-width:640px){.form input.nt{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Investment dashboard</h1>
<div class="seg" id="viewSeg"></div>
</header>
<div class="bar" id="bar"></div>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="card mu">Loading your dashboard…</div></main>
<p class="note" id="foot"></p>
</div>
<script>window.onerror=function(m,u,l){var e=document.getElementById("main");if(e)e.innerHTML='<div class="card"><b>The page hit an error.</b><br>'+String(m).replace(/</g,"&lt;")+" (line "+l+")</div>"};</script>
<script>
var KEY="invdash.v1",CUR={IN:"INR",AU:"AUD"},S,view="ALL",tab="overview";
function seed(){return{fx:55,base:"INR",sample:true,goldRate:{IN:15000,AU:260},next:20,items:[
{id:1,market:"IN",cat:"stock",name:"RELIANCE",qty:20,cost:2400,price:2900},
{id:2,market:"IN",cat:"stock",name:"TCS",qty:10,cost:3600,price:4100},
{id:3,market:"AU",cat:"stock",name:"CBA",qty:15,cost:110,price:165},
{id:4,market:"IN",cat:"gold",name:"Physical gold",qty:50,cost:6000,price:0},
{id:5,market:"IN",cat:"cash",name:"Savings account",qty:250000,cost:1,price:1},
{id:6,market:"AU",cat:"cash",name:"Everyday account",qty:8000,cost:1,price:1}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();S.adj=S.adj||{IN:0,AU:0};var stat="Fetching live prices…";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(x,c,d){return new Intl.NumberFormat(c==="INR"?"en-IN":"en-AU",{style:"currency",currency:c,maximumFractionDigits:d||0,minimumFractionDigits:d||0}).format(x)}
function pct(x){return(x>=0?"+":"")+x.toFixed(1)+"%"}
function price(i){return i.cat==="gold"?S.goldRate[i.market]:i.cat==="cash"?1:i.price}
function val(i){return i.qty*price(i)}
function cost(i){return i.qty*(i.cat==="cash"?1:i.cost)}
function conv(x,from,to){return from===to?x:from==="AUD"?x*S.fx:x/S.fx}
function target(){return view==="IN"?"INR":view==="AU"?"AUD":S.base}
function inView(i){return view==="ALL"||i.market===view}
function sum(list,fn){var t=target();return list.reduce(function(a,i){return a+conv(fn(i),CUR[i.market],t)},0)}
function catOf(i){return i.cat==="stock"?"Stocks":i.cat==="cash"?"Cash":"Gold"}
function pl(i){var c=cost(i);return c?(val(i)-c)/c*100:0}
function plCell(i){var d=val(i)-cost(i);return'<span class="'+(d>=0?"up":"dn")+'">'+money(d,CUR[i.market])+" ("+pct(pl(i))+")</span>"}
function tag(m){return'<span class="tag '+m+'">'+(m==="IN"?"India":"AUS")+"</span>"}
function setView(v){view=v;render()}
function setTab(t){tab=t;render()}
function setFx(v){var n=parseFloat(v);if(n>0){S.fx=n;save();render()}}
function setBase(c){S.base=c;save();render()}
function setAdj(m,v){var n=parseFloat(v);if(!isNaN(n)){S.adj[m]=n;save();refresh()}}
function calib(m){var v=parseFloat(document.getElementById("cal-"+m).value),sp=S.spot&&S.spot[m];if(!(v>0)||!(sp>0)){alert("Wait for live prices to load, then enter the rate you see.");return}S.adj[m]=Math.round((v/sp-1)*10000)/100;save();refresh().then(render)}
function editNote(id){var it=S.items.filter(function(i){return i.id===id})[0];if(!it)return;var v=prompt("Note for "+it.name+" (where it came from, broker, reason)",it.note||"");if(v!==null){it.note=v.trim();save();render()}}
function setGold(m,v){var n=parseFloat(v);if(n>=0){S.goldRate[m]=n;save();render()}}
function setField(id,f,v){var n=parseFloat(v);if(n>=0){S.items.forEach(function(i){if(i.id===id)i[f]=n});save();render()}}
function del(id){S.items=S.items.filter(function(i){return i.id!==id});save();render()}
function g(id){return document.getElementById(id).value}
function addItem(cat){
var sel=(cat==="stock"&&pick&&g("f-n").trim()===pick.symbol)?pick:null,m=g("f-m"),name=g("f-n").trim(),q=parseFloat(g("f-q")),c=cat==="cash"?1:parseFloat(g("f-c")),p=0;
if(cat==="stock"||cat==="gold_etf"){cat=g("f-t");p=parseFloat(g("f-p"))||0}
if(!name||!(q>=0)||!(c>=0)||(cat!=="gold"&&cat!=="cash"&&!(p>=0))){alert("Fill in every field with valid numbers.");return}
if(S.sample){S.items=[];S.sample=false}
S.items.push({id:S.next++,note:(document.getElementById("f-note").value||"").trim(),co:sel?sel.name:"",market:sel?sel.market:m,cat:cat,name:name,qty:q,cost:c,price:cat==="cash"?1:p});save();render();refresh()}
function clearSample(){S.items=[];S.sample=false;save();render()}
function mSel(){var d=view==="AU"?"AU":"IN";return'<select id="f-m"><option value="IN"'+(d==="IN"?" selected":"")+'>India</option><option value="AU"'+(d==="AU"?" selected":"")+">Australia</option></select>"}
function donut(list){
var cats={Stocks:0,Gold:0,Cash:0},t=target(),tot=0;
list.forEach(function(i){var v=conv(val(i),CUR[i.market],t);cats[catOf(i)]+=v;tot+=v});
var cols={Stocks:"var(--k1)",Gold:"var(--k2)",Cash:"var(--k3)"},off=0,seg="",leg="";
Object.keys(cats).forEach(function(k){var f=tot?cats[k]/tot:0,len=f*251.3;
seg+='<circle r="40" cx="60" cy="60" fill="none" stroke="'+cols[k]+'" stroke-width="20" stroke-dasharray="'+len+" "+(251.3-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=len;
leg+='<div><span><i class="dot" style="background:'+cols[k]+'"></i>'+k+"</span><span>"+money(cats[k],t)+" · "+(f*100).toFixed(0)+"%</span></div>"});
return'<div class="donut"><svg width="150" height="150" viewBox="0 0 120 120" role="img" aria-label="Allocation by asset type">'+(tot?seg:'<circle r="40" cx="60" cy="60" fill="none" stroke="var(--bd)" stroke-width="20"/>')+'</svg><div class="leg">'+leg+"</div></div>"}
function overview(){
var L=S.items.filter(inView),t=target(),v=sum(L,val),c=sum(L.filter(function(i){return i.cat!=="cash"}),cost),
nv=sum(L.filter(function(i){return i.cat!=="cash"}),val),d=nv-c,h='';
h+='<div class="card"><div class="mu">'+(view==="ALL"?"Combined portfolio":view==="IN"?"India portfolio":"Australia portfolio")+" value</div><div class=\"big\">"+money(v,t)+'</div><div class="stats"><div><span>Invested (excl. cash)</span>'+money(c,t)+'</div><div><span>Profit / loss</span><b class="'+(d>=0?"up":"dn")+'">'+money(d,t)+" ("+pct(c?d/c*100:0)+')</b></div><div><span>Holdings</span>'+L.length+"</div></div></div>";
if(view==="ALL"){var iv=sum(S.items.filter(function(i){return i.market==="IN"}),val),av=sum(S.items.filter(function(i){return i.market==="AU"}),val);
h+='<div class="grid"><div class="card"><div class="mu">'+tag("IN")+'India</div><div class="big" style="font-size:24px">'+money(iv,t)+'</div></div><div class="card"><div class="mu">'+tag("AU")+'Australia</div><div class="big" style="font-size:24px">'+money(av,t)+"</div></div></div>"}
h+='<div class="card"><h2>Allocation</h2>'+donut(L)+"</div>";
if(S.sample)h+='<div class="card note">This is sample data so you can see the layout. <button class="btn" onclick="clearSample()">Clear sample data</button></div>';
return h}
function table(list,kind){
if(!list.length)return'<div class="empty">Nothing here yet. Add your first entry below.</div>';
var gd=kind==="gold",h='<div class="scroll"><table class="tb"><thead><tr>';
h+=kind==="cash"?"<th>Account</th><th>Balance</th><th></th>":"<th>"+(gd?"Item":"Name")+"</th><th>"+(gd?"Grams":"Qty")+"</th><th>Avg cost</th><th>"+(gd?"Rate/g":"Price")+"</th><th>Value</th><th>Profit / loss</th><th></th>";
h+="</tr></thead><tbody>";
list.forEach(function(i){var c=CUR[i.market],n=esc(i.name)+(view==="ALL"?tag(i.market):"")+(i.cat==="gold_etf"?'<span class="mu"> (gold ETF)</span>':"")+(i.co?'<div class="mu" style="font-size:12px;font-weight:400">'+esc(i.co)+"</div>":"")+'<button class="nb" onclick="editNote('+i.id+')">'+(i.note?"✎ "+esc(i.note):"+ Add note")+"</button>",x='<td class="del"><button class="x" onclick="del('+i.id+')" aria-label="Delete">×</button></td>';
if(kind==="cash")h+="<tr><td>"+n+'</td><td data-label="Balance"><input type="number" min="0" value="'+i.qty+'" onchange="setField('+i.id+",'qty',this.value)\" aria-label=\"Balance\"> "+c+"</td>"+x+"</tr>";
else h+="<tr><td>"+n+'</td><td data-label="'+(gd?"Grams":"Quantity")+'">'+i.qty+'</td><td data-label="Avg cost">'+money(i.cost,c,2)+'</td><td data-label="'+(gd?"Rate per gram":"Price")+'">'+(i.cat==="gold"?money(price(i),c,2):'<input type="number" min="0" step="0.01" value="'+i.price+'" onchange="setField('+i.id+",'price',this.value)\" aria-label=\"Price\">")+'</td><td data-label="Value">'+money(val(i),c)+'</td><td data-label="Profit / loss">'+plCell(i)+"</td>"+x+"</tr>"});
return h+"</tbody></table></div>"}
function stocks(){
var L=S.items.filter(function(i){return inView(i)&&(i.cat==="stock"||i.cat==="gold_etf")});
return'<div class="card"><h2>Stocks and gold ETFs</h2>'+table(L,"stock")+'</div><div class="card"><h2>Add a holding</h2><div class="form">'+mSel()+'<select id="f-t"><option value="stock">Stock</option><option value="gold_etf">Gold ETF</option></select><div class="sugw"><input class="nm" id="f-n" placeholder="Search company or symbol" autocomplete="off" oninput="srch(this.value)" style="width:230px"><div id="sug" class="sug"></div></div><input id="f-q" type="number" min="0" placeholder="Quantity"><input id="f-c" type="number" min="0" step="0.01" placeholder="Avg buy price"><input id="f-p" type="number" min="0" step="0.01" placeholder="Price (auto-filled)"><input class="nt" id="f-note" placeholder="Note (optional), e.g. bought via Zerodha"><button class="btn" onclick="addItem(\'stock\')">Add holding</button></div><p class="note">Type a company name, pick it from the list, then enter your quantity and average buy price. The current price fills in by itself and refreshes every minute.</p></div>'}
function gold(){
var L=S.items.filter(function(i){return inView(i)&&i.cat==="gold"}),E=S.items.filter(function(i){return inView(i)&&i.cat==="gold_etf"});
var h='<div class="card"><h2>Gold rate per gram</h2><div class="form"><label>India (INR) <input type="number" min="0" value="'+S.goldRate.IN+'" onchange="setGold(\'IN\',this.value)"></label><label>Australia (AUD) <input type="number" min="0" value="'+S.goldRate.AU+'" onchange="setGold(\'AU\',this.value)"></label></div><div class="form" style="margin-top:10px"><label>India adjustment % <input type="number" step="0.1" value="'+S.adj.IN+'" onchange="setAdj(\'IN\',this.value)"></label><label>Australia adjustment % <input type="number" step="0.1" value="'+S.adj.AU+'" onchange="setAdj(\'AU\',this.value)"></label></div><div class="form" style="margin-top:10px"><label>India rate you see today (INR/g) <input id="cal-IN" type="number" min="0" placeholder="e.g. 14268"></label><button class="btn" onclick="calib(\'IN\')">Match India</button></div><div class="form" style="margin-top:8px"><label>Australia rate you see today (AUD/g) <input id="cal-AU" type="number" min="0" placeholder="e.g. 260"></label><button class="btn" onclick="calib(\'AU\')">Match Australia</button></div><p class="note">The rate follows the live international gold price. Enter the rate shown by your jeweller or a site you trust and the adjustment is worked out for you, covering duty, GST and premium. Check it again now and then. International price now: \'+(S.spot&&S.spot.IN?money(S.spot.IN,"INR",2):"loading")+\' per gram (INR), \'+(S.spot&&S.spot.AU?money(S.spot.AU,"AUD",2):"loading")+\' per gram (AUD).</p></div>';
h+='<div class="card"><h2>Physical gold</h2>'+table(L,"gold")+"</div>";
if(E.length)h+='<div class="card"><h2>Gold ETFs</h2>'+table(E,"stock")+"</div>";
return h+'<div class="card"><h2>Add physical gold</h2><div class="form">'+mSel()+'<input class="nm" id="f-n" placeholder="Label, e.g. Coins"><input id="f-q" type="number" min="0" placeholder="Grams"><input id="f-c" type="number" min="0" step="0.01" placeholder="Cost per gram"><input class="nt" id="f-note" placeholder="Note (optional), e.g. bought via Zerodha"><button class="btn" onclick="addItem(\'gold\')">Add gold</button></div></div>'}
function cash(){
var L=S.items.filter(function(i){return inView(i)&&i.cat==="cash"});
return'<div class="card"><h2>Cash accounts</h2>'+table(L,"cash")+'</div><div class="card"><h2>Add a cash account</h2><div class="form">'+mSel()+'<input class="nm" id="f-n" placeholder="Account name"><input id="f-q" type="number" min="0" placeholder="Balance"><input class="nt" id="f-note" placeholder="Note (optional), e.g. bought via Zerodha"><button class="btn" onclick="addItem(\'cash\')">Add account</button></div></div>'}
function render(){
var V=[["IN","India"],["AU","Australia"],["ALL","Combined"]],T=[["overview","Overview"],["stocks","Stocks"],["gold","Gold"],["cash","Cash"]];
document.getElementById("viewSeg").innerHTML=V.map(function(v){return'<button class="'+(view===v[0]?"on":"")+'" onclick="setView(\''+v[0]+'\')">'+v[1]+"</button>"}).join("");
document.getElementById("tabs").innerHTML=T.map(function(v){return'<button class="'+(tab===v[0]?"on":"")+'" onclick="setTab(\''+v[0]+'\')">'+v[1]+"</button>"}).join("");
document.getElementById("bar").innerHTML='<label>INR per 1 AUD <input type="number" min="0" step="0.01" value="'+S.fx+'" onchange="setFx(this.value)"></label>'+'<button class="btn" onclick="refresh()">Refresh prices</button><span>'+esc(stat)+"</span>"+(view==="ALL"?'<label>Show combined in <select onchange="setBase(this.value)"><option'+(S.base==="INR"?" selected":"")+'>INR</option><option'+(S.base==="AUD"?" selected":"")+">AUD</option></select></label>":"");
document.getElementById("main").innerHTML=tab==="overview"?overview():tab==="stocks"?stocks():tab==="gold"?gold():cash();
document.getElementById("foot").textContent="Your holdings are saved in this browser only. Prices are from Yahoo Finance and can be delayed."}
var pick=null,stm=null,res=[];
function srch(v){pick=null;clearTimeout(stm);var box=document.getElementById("sug");
if(v.trim().length<2){box.innerHTML="";return}
stm=setTimeout(async function(){try{
var r=await fetch("/api/search?q="+encodeURIComponent(v.trim()));var d=await r.json();res=d.results||[];
box.innerHTML=res.length?res.map(function(x,k){return'<button type="button" class="opt" onclick="choose('+k+')">'+esc(x.name)+' <span class="mu">'+esc(x.symbol)+"</span>"+tag(x.market)+"</button>"}).join(""):'<div class="opt mu">'+(d.error?"Search unavailable ("+esc(d.error)+"). Type the symbol instead.":"No match on NSE, BSE or ASX.")+"</div>"
}catch(e){box.innerHTML='<div class="opt mu">Search unavailable. Type the symbol instead.</div>'}},300)}
function choose(k){pick=res[k];document.getElementById("f-n").value=pick.symbol;document.getElementById("f-m").value=pick.market;document.getElementById("sug").innerHTML=""}
function ySym(i){var n=i.name.trim().toUpperCase();return n.indexOf(".")>-1?n:n+(i.market==="IN"?".NS":".AX")}
async function refresh(){
var syms=S.items.filter(function(i){return i.cat==="stock"||i.cat==="gold_etf"}).map(ySym);
try{
var r=await fetch("/api/quotes?symbols="+encodeURIComponent(syms.join(",")));
if(!r.ok)throw new Error(r.status);
var d=await r.json(),bad=[];
S.items.forEach(function(i){if(i.cat==="stock"||i.cat==="gold_etf"){var q=d.quotes[ySym(i)];if(q&&q.price>0)i.price=Math.round(q.price*100)/100;else bad.push(i.name+(d.errors&&d.errors[ySym(i)]?" ("+d.errors[ySym(i)]+")":""))}});if(!d.gold)bad.push("gold rate"+(d.errors&&d.errors.gold?" ("+d.errors.gold+")":""));
if(d.gold){S.spot=S.spot||{};["IN","AU"].forEach(function(m){if(d.gold[m]>0)S.spot[m]=d.gold[m];if(d.gold[m]>0)S.goldRate[m]=Math.round(d.gold[m]*(1+(S.adj[m]||0)/100)*100)/100})}
if(d.fx>0)S.fx=Math.round(d.fx*100)/100;
save();stat="Updated "+new Date().toLocaleTimeString()+(bad.length?". No price found for "+bad.join(", ")+".":".");
}catch(e){stat="Live prices unavailable. Showing your last values."}
var ae=document.activeElement&&document.activeElement.tagName;if(ae!=="INPUT"&&ae!=="SELECT"&&ae!=="BUTTON")render()}
render();refresh();setInterval(refresh,60000);
</script>
</body>
</html>
